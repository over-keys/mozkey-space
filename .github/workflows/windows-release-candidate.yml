name: Windows release candidates (x64 / ARM64, unsigned)

# Audited unsigned release candidates; no signing or automatic publication.
# Pull requests execute contract tests only; MSI builds require dispatch from main or explicitly allowed staging branches.
# Universal MSI remains supported by the regular Windows CI, NOT released here.
on:
  push:
    branches: ['release/1.0.0-space']
  pull_request:
    paths:
      - '.github/workflows/windows-release-candidate.yml'
      - 'tools/release/**'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact public version in src/version.bzl (e.g. 1.0.0)'
        type: string
        required: true
  # Reusable from the isolated SignPath TEST workflow. Existing dispatch and PR
  # behavior stays unchanged; this workflow never signs its output.
  workflow_call:
    inputs:
      release_version:
        description: 'Exact release version for audited MSI candidates'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: unsigned-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract-tests:
    name: Source contract regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Run release contract tests
        run: python3 -B -m unittest discover -s tools/release/tests -v

  prepare-dictionary:
    name: Prepare one verified dictionary input for both architectures
    needs: source-contract-tests
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/1.0.0-space' || github.ref == 'refs/heads/integration/upstream-1.1.0')
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      EXPECTED_VERSION: ${{ inputs.release_version || '1.0.0' }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.sha }}

      - name: Validate source before generating dictionaries
        shell: pwsh
        run: |
          python tools/release/verify_source_contract.py `
            --version $env:EXPECTED_VERSION `
            --expected-sha $env:EXPECTED_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source contract verification failed.' }

      - name: Generate daily dictionary once on x64 Windows
        shell: pwsh
        run: |
          ./tools/dictionary/prepare_daily_dictionary.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Dictionary preparation failed.' }

      - name: Record generated dictionary bytes and source modifications
        shell: pwsh
        run: |
          python tools/release/capture_dictionary_provenance.py `
            --repo . `
            --output "$env:RUNNER_TEMP/dictionary-provenance.json"
          if ($LASTEXITCODE -ne 0) { throw 'Dictionary evidence capture failed.' }

      # No cache, only source-derived products from the SAME workflow run.
      - name: Upload dictionary build inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mozkey-release-dictionary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/data/dictionary_koyasi/generated/**
            dist/dictionary/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload dictionary provenance separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mozkey-release-dictionary-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dictionary-provenance.json
          if-no-files-found: error
          retention-days: 30

  unsigned-candidate:
    name: Build and validate unsigned ${{ matrix.arch }} MSI (manual main / 1.0.0 staging)
    needs: [source-contract-tests, prepare-dictionary]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/1.0.0-space' || github.ref == 'refs/heads/integration/upstream-1.1.0')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            host_arch: AMD64
          - arch: arm64
            runner: windows-11-arm
            host_arch: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      TARGET_ARCH: ${{ matrix.arch }}
      EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
      EXPECTED_VERSION: ${{ inputs.release_version || '1.0.0' }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.sha }}

      - name: Validate runner, Git SHA, version, and installer source contract
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -cne $env:EXPECTED_HOST_ARCH) {
            throw "Unexpected runner architecture: $env:PROCESSOR_ARCHITECTURE; expected $env:EXPECTED_HOST_ARCH"
          }
          python tools/release/verify_source_contract.py `
            --version $env:EXPECTED_VERSION `
            --expected-sha $env:EXPECTED_SOURCE_SHA `
            --output "$env:RUNNER_TEMP/source-contract.json"
          if ($LASTEXITCODE -ne 0) { throw 'Source contract verification failed.' }

      - name: Verify pinned Windows Zenz runtimes and model
        shell: pwsh
        run: |
          python tools/zenz_runtime/runtime_lock.py check
          if ($LASTEXITCODE -ne 0) { throw 'Zenz runtime lock verification failed.' }

      - name: Download exact dictionary inputs from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mozkey-release-dictionary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Download provenance of the same dictionary inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mozkey-release-dictionary-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dictionary-evidence

      - name: Reject missing or changed dictionary input files
        shell: pwsh
        run: |
          python tools/release/capture_dictionary_provenance.py `
            --repo . `
            --verify-against "$env:RUNNER_TEMP/dictionary-evidence/dictionary-provenance.json" `
            --output "$env:RUNNER_TEMP/dictionary-input-verification.json"
          if ($LASTEXITCODE -ne 0) { throw 'Dictionary input integrity verification failed.' }

      # No actions/cache. update_deps verifies pinned archive checksums.
      - name: Download and verify pinned build dependencies
        shell: pwsh
        working-directory: src
        run: |
          python build_tools/update_deps.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency retrieval failed.' }

      - name: Ensure complete MSVC 14.44 mixed-architecture toolset
        timeout-minutes: 30
        if: matrix.arch == 'arm64'
        shell: pwsh
        working-directory: src
        run: |
          $vc = (python build_tools/vs_util.py --arch arm64).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio discovery failed.' }
          $versions = @(Get-ChildItem -LiteralPath (Join-Path $vc 'Tools/MSVC') -Directory |
            Where-Object { $_.Name -match '^14\.44\.[0-9]+$' } |
            Sort-Object { [version]$_.Name } -Descending)
          if ($versions.Count -eq 0) { throw 'Required MSVC 14.44 ARM64 toolset is not installed.' }
          $toolset = $versions[0].FullName
          # ARM64 MSI embeds x86, x64, and ARM64 TIP DLLs, not just native code.
          $required = @('include/yvals_core.h', 'atlmfc/include/atlbase.h')
          foreach ($arch in @('x86', 'x64', 'arm64')) {
            foreach ($lib in @('libcmt.lib', 'oldnames.lib', 'libcpmt.lib', 'libvcruntime.lib', 'msvcrt.lib', 'msvcprt.lib', 'vcruntime.lib')) {
              $required += "lib/$arch/$lib"
            }
            $required += "atlmfc/lib/$arch/atls.lib"
          }
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $toolset $_) -PathType Leaf) })
          if ($missing.Count -gt 0) {
            Write-Host "Missing mixed-architecture components: $($missing -join ', ')"
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/setup.exe'
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Visual Studio Installer is unavailable.' }
            $installPath = Split-Path -Parent $vc
            $arguments = @('modify', '--installPath', "`"$installPath`"", '--add',
              'Microsoft.VisualStudio.Component.VC.14.44.17.14.ARM64', '--add',
              'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64', '--add',
              'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL.ARM64', '--add',
              'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', '--quiet', '--norestart')
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "Matching ATL installation failed: $($process.ExitCode)" }
          }

      # LLVM 20.1.1 cannot use the VS 2026 latest STL (requires Clang 22).
      # Keep the checksum-pinned LLVM and select the installed v143 toolset.
      - name: Select LLVM 20 compatible native ARM64 MSVC toolset
        if: matrix.arch == 'arm64'
        shell: pwsh
        working-directory: src
        run: |
          $vc = (python build_tools/vs_util.py --arch arm64).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio discovery failed.' }
          $versions = @(Get-ChildItem -LiteralPath (Join-Path $vc 'Tools/MSVC') -Directory |
            Where-Object { $_.Name -match '^14\.44\.[0-9]+$' } |
            Sort-Object { [version]$_.Name } -Descending)
          if ($versions.Count -eq 0) { throw 'Required MSVC 14.44 ARM64 toolset is not installed.' }
          $version = $versions[0].Name
          $required = @('bin/Hostarm64/arm64/cl.exe', 'include/yvals_core.h', 'atlmfc/include/atlbase.h')
          foreach ($arch in @('x86', 'x64', 'arm64')) {
            foreach ($lib in @('libcmt.lib', 'oldnames.lib', 'libcpmt.lib', 'libvcruntime.lib', 'msvcrt.lib', 'msvcprt.lib', 'vcruntime.lib')) {
              $required += "lib/$arch/$lib"
            }
            $required += "atlmfc/lib/$arch/atls.lib"
          }
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $versions[0].FullName $relative) -PathType Leaf)) {
              throw "Incomplete MSVC $version ARM64 toolset: $relative"
            }
          }
          $env:BAZEL_VC = $vc
          $env:BAZEL_VC_FULL_VERSION = $version
          python -c "import sys; sys.path.insert(0, 'build_tools'); import vs_util, os; e=vs_util.get_vs_env_vars('arm64'); actual=e.get('VCTOOLSVERSION', '').rstrip('/\\'); assert actual == os.environ['BAZEL_VC_FULL_VERSION'], (actual, os.environ['BAZEL_VC_FULL_VERSION']); print('ARM64_MSVC_TOOLSET=' + actual)"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC toolset activation verification failed.' }
          "BAZEL_VC=$vc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BAZEL_VC_FULL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify all MSI architectures with static and dynamic CRT STL and ATL
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          python tools/release/verify_windows_arm64_toolchain.py
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 CRT/STL/ATL toolchain probe failed.' }

      # This generator uses MSVC cl/link/rc to combine empty ARM64EC and ARM64
      # objects into the ARM64X forwarder; CRT probes alone do not exercise it.
      - name: Verify ARM64X forwarder toolchain before Qt
        if: matrix.arch == 'arm64'
        timeout-minutes: 20
        shell: pwsh
        working-directory: src
        run: |
          bazelisk build //win32/tip:mozc_tip64x --config release_build --verbose_failures
          if ($LASTEXITCODE -ne 0) { throw 'ARM64X forwarder toolchain verification failed.' }

      - name: Build Qt for release target architecture
        shell: pwsh
        working-directory: src
        run: |
          $qtArgs = @('build_tools/build_qt.py', '--release', '--confirm_license')
          if ($env:TARGET_ARCH -eq 'arm64') { $qtArgs += '--target_arch=arm64' }
          python @qtArgs
          if ($LASTEXITCODE -ne 0) { throw 'Qt release build failed.' }

      - name: Free temporary Qt source space
        shell: pwsh
        run: |
          $qtSrc = 'src/third_party/qt_src'
          if (Test-Path -LiteralPath $qtSrc -PathType Container) {
            Remove-Item -LiteralPath $qtSrc -Recurse -Force -ErrorAction Stop
          }

      - name: Stage CRT required by existing WiX build
        shell: pwsh
        run: ./tools/release/Prepare-WindowsCrt.ps1

      - name: Build unsigned native Windows MSI
        shell: pwsh
        working-directory: src
        env:
          ANDROID_NDK_HOME: ''
        run: |
          if ($env:TARGET_ARCH -eq 'arm64') {
            # Mirror the known-good native ARM64 command in windows.yaml.
            bazelisk build package --config release_build --verbose_failures
          } else {
            bazelisk build --config oss_windows --config release_build package --verbose_failures
          }
          if ($LASTEXITCODE -ne 0) { throw "Windows $env:TARGET_ARCH MSI build failed." }

      - name: Validate release security source and compiled imports
        shell: pwsh
        run: |
          python tools/check_no_network_symbols.py
          if ($LASTEXITCODE -ne 0) { throw 'Prohibited source network symbols found.' }
          python tools/check_no_network_imports.py --root src/bazel-bin
          if ($LASTEXITCODE -ne 0) { throw 'Prohibited binary imports found.' }
          python tools/check_no_network_strings.py --root src/bazel-bin
          if ($LASTEXITCODE -ne 0) { throw 'Prohibited binary strings found.' }

      - name: Run offline configuration regression tests
        shell: pwsh
        working-directory: src
        run: |
          if ($env:TARGET_ARCH -eq 'arm64') {
            bazelisk test --config release_build `
              --test_output=errors `
              //config:stats_config_util_test //config:config_handler_test `
              //session:session_test //session:keymap_test `
              //session:zenz_context_request_test //session:session_handler_test `
              //engine:engine_converter_test
          } else {
            bazelisk test --config oss_windows --config release_build `
              --test_output=errors `
              //config:stats_config_util_test //config:config_handler_test `
              //session:session_test //session:keymap_test `
              //session:zenz_context_request_test //session:session_handler_test `
              //engine:engine_converter_test
          }
          if ($LASTEXITCODE -ne 0) { throw 'Offline configuration regression tests failed.' }

      - name: Build and run real config-dialog regression tests
        shell: pwsh
        working-directory: src
        run: |
          bazelisk build --config release_build //gui/config_dialog:config_dialog_ui_test
          if ($LASTEXITCODE -ne 0) { throw 'Config-dialog test build failed.' }
          $env:PATH = "$pwd/third_party/qt/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$pwd/third_party/qt/plugins"
          $env:QT_QPA_PLATFORM = 'offscreen'
          & ./bazel-bin/gui/config_dialog/config_dialog_ui_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Config-dialog regression failed.' }

      - name: Verify MSI identity, architecture, Zenz hashes and stage candidate
        id: verify_msi
        shell: pwsh
        run: |
          ./tools/release/Verify-WindowsMsiCandidate.ps1 `
            -Repo $env:GITHUB_WORKSPACE `
            -SourceMsi "$env:GITHUB_WORKSPACE/src/bazel-bin/win32/installer/Mozc64.msi" `
            -Architecture $env:TARGET_ARCH `
            -ReleaseVersion $env:EXPECTED_VERSION `
            -SourceSha $env:EXPECTED_SOURCE_SHA `
            -OutputDirectory "$env:RUNNER_TEMP/release-unsigned" `
            -EvidenceDirectory "$env:RUNNER_TEMP/release-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'MSI release candidate verification failed.' }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'release-evidence/candidate-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json
          $fileName = [string]$manifest.release_filename
          if ([string]::IsNullOrWhiteSpace($fileName) -or $fileName -cne [IO.Path]::GetFileName($fileName)) {
            throw 'Invalid release filename in MSI evidence.'
          }
          $staged = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'release-unsigned') -File -Filter '*.msi')
          if ($staged.Count -ne 1 -or $staged[0].Name -cne $fileName) {
            throw 'Staged MSI does not match exact release filename.'
          }
          "filename=$fileName" >> $env:GITHUB_OUTPUT

      - name: Upload verified unsigned MSI candidate (not a public release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mozkey-unsigned-${{ matrix.arch }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-unsigned/${{ steps.verify_msi.outputs.filename }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload architecture-specific verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mozkey-unsigned-${{ matrix.arch }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-contract.json
            ${{ runner.temp }}/release-evidence/candidate-manifest.json
            ${{ runner.temp }}/dictionary-input-verification.json
          if-no-files-found: error
          retention-days: 30
