name: CI for Lint checks
# https://github.com/google/mozc/blob/master/docs/build_mozc_in_docker.md

# Run on normal commits and pull requests. Keep this workflow lightweight so
# source-level regressions are caught without starting a full platform build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  buildifier:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Checkout without submodules to exclude third_party code from lint check
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Run
        working-directory: ./src
        run: |
          go install github.com/bazelbuild/buildtools/buildifier@v8.5.1
          $(go env GOPATH)/bin/buildifier --mode=diff -r .

  source_security:
    name: Source security guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Check prohibited network symbols
        run: python3 tools/check_no_network_symbols.py
