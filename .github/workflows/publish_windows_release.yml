name: Publish Windows Release asset

on:
  release:
    types:
      - published

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish_windows_release:
    name: Publish Windows MSI to GitHub Release
    runs-on: ubuntu-latest
    # The artifact may be delayed by the full Windows build. Allow the
    # publisher to poll for up to 60 minutes, plus time for download/upload.
    timeout-minutes: 90

    steps:
      - name: Resolve public release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+)(\.|$) ]]; then
            PUBLIC_VERSION="${BASH_REMATCH[1]}"
          else
            echo "Release tag does not contain a public major.minor version: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "public_version=$PUBLIC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for matching Windows CI artifact
        id: windows_ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Poll every 30 seconds for up to 60 minutes.
          for attempt in $(seq 1 120); do
            runs="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow windows.yaml \
                --limit 50 \
                --json databaseId,status,conclusion,headSha,headBranch
            )"

            run_id="$(
              jq -r \
                --arg sha "$SOURCE_SHA" \
                --arg branch "$RELEASE_TAG" \
                '[.[] | select(.headSha == $sha and .headBranch == $branch)]
                 | sort_by(.databaseId)
                 | last
                 | .databaseId // empty' \
                <<< "$runs"
            )"

            if [[ -n "$run_id" ]]; then
              run_status="$(
                jq -r \
                  --arg id "$run_id" \
                  '.[] | select((.databaseId | tostring) == $id) | .status' \
                  <<< "$runs"
              )"
              run_conclusion="$(
                jq -r \
                  --arg id "$run_id" \
                  '.[] | select((.databaseId | tostring) == $id) | .conclusion' \
                  <<< "$runs"
              )"

              echo "Windows CI run $run_id: $run_status / $run_conclusion"

              if [[ "$run_status" == "completed" && "$run_conclusion" == "success" ]]; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if [[ "$run_status" == "completed" && "$run_conclusion" != "" && "$run_conclusion" != "null" ]]; then
                echo "Matching Windows CI run did not succeed: $run_conclusion" >&2
                exit 1
              fi
            else
              echo "Waiting for Windows CI push run for $RELEASE_TAG at $SOURCE_SHA"
            fi

            if (( attempt == 120 )); then
              echo "Timed out waiting for the matching Windows CI artifact." >&2
              exit 1
            fi

            sleep 30
          done

      - name: Download matching Windows MSI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh run download \
            "${{ steps.windows_ci.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name Mozc64_x64.msi \
            --dir windows-artifact

      - name: Upload Windows MSI and checksum to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLIC_VERSION: ${{ steps.version.outputs.public_version }}
        run: |
          set -euo pipefail

          mapfile -t msis < <(find windows-artifact -type f -name '*.msi' -print)
          if (( ${#msis[@]} != 1 )); then
            echo "Expected exactly one Windows MSI, found ${#msis[@]}" >&2
            exit 1
          fi

          asset="mozkey-space_${PUBLIC_VERSION}_windows_x64.msi"
          checksum="${asset}.sha256"

          install -m 0644 "${msis[0]}" "$asset"
          sha256sum "$asset" > "$checksum"

          gh release edit \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "mozkey-space ${PUBLIC_VERSION}"

          gh release upload \
            "$RELEASE_TAG" \
            "$asset" \
            "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
