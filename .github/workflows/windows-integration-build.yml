name: Build integration candidate on scoped push (no release)

# The established candidate workflow remains the single implementation.
# Diagnostic-only commits do not start a full product build.
on:
  push:
    branches: ['integration/upstream-1.1.0']
    paths:
      - '.github/workflows/windows-integration-build.yml'
      - '.github/workflows/windows-release-candidate.yml'
      - 'tools/release/Prepare-WindowsToolchain.ps1'
      - 'tools/release/verify_windows_arm64_toolchain.py'
      - 'src/**'

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'over-keys/mozkey-space' && github.ref == 'refs/heads/integration/upstream-1.1.0' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[toolchain-diagnostic]')
    uses: ./.github/workflows/windows-release-candidate.yml
    with:
      release_version: '1.1.0'
