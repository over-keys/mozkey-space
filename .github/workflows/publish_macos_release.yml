name: Publish macOS Release asset

on:
  release:
    types:
      - published
  workflow_run:
    workflows:
      - macOS Zenz formal package dual-native validation
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-macos-${{ github.event.release.tag_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish_macos_release:
    name: Publish macOS PKG to GitHub Release
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve release and macOS CI rendezvous
        id: rendezvous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
        run: |
          set -euo pipefail

          pending() {
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release and macOS CI are not both ready; the other event will retry."
          }

          validate_release_tag() {
            local tag="$1"
            if [[ "$tag" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
              PUBLIC_VERSION="${BASH_REMATCH[1]}"
              return 0
            fi
            return 1
          }

          resolve_tag_sha() {
            local tag="$1"
            local tag_json object_type object_sha

            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            object_type="$(jq -r '.object.type // empty' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha // empty' <<<"$tag_json")"

            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit)
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
                  object_type="$(jq -r '.object.type // empty' <<<"$tag_json")"
                  object_sha="$(jq -r '.object.sha // empty' <<<"$tag_json")"
                  ;;
                *)
                  echo "Tag does not resolve to a commit: ${tag}" >&2
                  return 1
                  ;;
              esac
            done

            echo "Tag indirection is too deep: ${tag}" >&2
            return 1
          }

          release_json=""
          release_tag=""
          run_id=""
          expected_sha=""

          if [[ "$EVENT_NAME" == "release" ]]; then
            release_tag="$RELEASE_EVENT_TAG"
            if ! validate_release_tag "$release_tag"; then
              echo "Release tag does not contain a public version: ${release_tag}" >&2
              exit 1
            fi

            expected_sha="$(resolve_tag_sha "$release_tag")"

            release_error="$RUNNER_TEMP/macos-release-error.log"
            if ! release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>"$release_error")"; then
              cat "$release_error" >&2
              echo "Published release could not be read for ${release_tag}." >&2
              exit 1
            fi

            release_tag_name="$(jq -r '.tag_name // empty' <<<"$release_json")"
            release_draft="$(jq -r '.draft | tostring' <<<"$release_json")"
            release_published_at="$(jq -r '.published_at // empty' <<<"$release_json")"
            if [[ "$release_tag_name" != "$release_tag" ||
                  "$release_draft" != "false" ||
                  -z "$release_published_at" ]]; then
              echo "Release is not a published release for ${release_tag}." >&2
              exit 1
            fi

            runs_json="$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/macos_zenz_formal_package_dual_native.yml/runs" \
              -f branch="$release_tag" \
              -f per_page=100)"
            matching_runs="$(jq -c \
              --arg tag "$release_tag" \
              --arg sha "$expected_sha" \
              '[.workflow_runs[]?
                | select(.name == "macOS Zenz formal package dual-native validation")
                | select(((.path // "") | split("@")[0]) == ".github/workflows/macos_zenz_formal_package_dual_native.yml")
                | select(.event == "push" or .event == "workflow_dispatch")
                | select(.head_branch == $tag and .head_sha == $sha)]' \
              <<<"$runs_json")"

            run_id="$(jq -r \
              'map(select(.status == "completed" and .conclusion == "success"))
               | sort_by(.id)
               | last
               | .id // empty' \
              <<<"$matching_runs")"
            if [[ -z "$run_id" ]]; then
              if jq -e 'any(.[]; .status != "completed")' <<<"$matching_runs" >/dev/null; then
                pending
                exit 0
              fi
              if jq -e \
                'any(.[]; .status == "completed" and (.conclusion // "") != "success")' \
                <<<"$matching_runs" >/dev/null; then
                echo "Matching macOS CI run for ${release_tag} did not succeed." >&2
                exit 1
              fi
              pending
              exit 0
            fi
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            # A manually dispatched run is accepted only when it resolves to
            # the exact release tag and commit. This keeps an explicitly
            # started recovery build usable without accepting an arbitrary
            # branch artifact.
            if [[ "$WORKFLOW_RUN_REPOSITORY" != "$GITHUB_REPOSITORY" ||
                  "$WORKFLOW_RUN_NAME" != "macOS Zenz formal package dual-native validation" ||
                  ("$WORKFLOW_RUN_EVENT" != "push" &&
                   "$WORKFLOW_RUN_EVENT" != "workflow_dispatch") ||
                  -z "$WORKFLOW_RUN_ID" ]]; then
              pending
              exit 0
            fi

            release_tag="$WORKFLOW_RUN_HEAD_BRANCH"
            if ! validate_release_tag "$release_tag"; then
              pending
              exit 0
            fi

            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}")"
            actual_run_id="$(jq -r '.id // empty' <<<"$run_json")"
            actual_run_name="$(jq -r '.name // empty' <<<"$run_json")"
            actual_run_path="$(jq -r '.path // empty' <<<"$run_json")"
            actual_run_event="$(jq -r '.event // empty' <<<"$run_json")"
            actual_run_status="$(jq -r '.status // empty' <<<"$run_json")"
            actual_run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            actual_head_branch="$(jq -r '.head_branch // empty' <<<"$run_json")"
            actual_head_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
            actual_run_workflow_file="${actual_run_path%%@*}"

            if [[ "$actual_run_id" != "$WORKFLOW_RUN_ID" ||
                  "$actual_run_name" != "macOS Zenz formal package dual-native validation" ||
                  "$actual_run_workflow_file" != ".github/workflows/macos_zenz_formal_package_dual_native.yml" ||
                  ("$actual_run_event" != "push" &&
                   "$actual_run_event" != "workflow_dispatch") ||
                  "$actual_run_status" != "completed" ||
                  -z "$actual_run_conclusion" ||
                  "$actual_run_conclusion" != "$WORKFLOW_RUN_CONCLUSION" ||
                  "$actual_head_branch" != "$release_tag" ]]; then
              echo "Triggering run identity or conclusion changed unexpectedly." >&2
              exit 1
            fi

            expected_sha="$(resolve_tag_sha "$release_tag")"
            if [[ "$actual_head_sha" != "$expected_sha" ||
                  "$WORKFLOW_RUN_HEAD_SHA" != "$actual_head_sha" ]]; then
              echo "macOS CI run SHA does not match tag ${release_tag}." >&2
              exit 1
            fi

            release_error="$RUNNER_TEMP/macos-release-error.log"
            if ! release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>"$release_error")"; then
              if grep -q 'HTTP 404' "$release_error"; then
                pending
                exit 0
              fi
              cat "$release_error" >&2
              exit 1
            fi

            release_tag_name="$(jq -r '.tag_name // empty' <<<"$release_json")"
            release_draft="$(jq -r '.draft | tostring' <<<"$release_json")"
            release_published_at="$(jq -r '.published_at // empty' <<<"$release_json")"
            if [[ "$release_tag_name" != "$release_tag" ||
                  "$release_draft" != "false" ||
                  -z "$release_published_at" ]]; then
              pending
              exit 0
            fi

            run_id="$WORKFLOW_RUN_ID"
            if [[ "$actual_run_conclusion" != "success" ]]; then
              echo "macOS CI run ${run_id} concluded ${actual_run_conclusion}; refusing to publish a macOS PKG for ${release_tag}." >&2
              exit 1
            fi
          else
            echo "Unsupported event: ${EVENT_NAME}" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "public_version=$PUBLIC_VERSION" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Publishing macOS CI run ${run_id} for ${release_tag} at ${expected_sha}."

      - name: Download matching macOS package
        if: steps.rendezvous.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh run download \
            "${{ steps.rendezvous.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name mozkey-zenz-formal-universal-package \
            --dir macos-artifact

      - name: Upload macOS PKG and checksum to Release
        if: steps.rendezvous.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.rendezvous.outputs.release_tag }}
          PUBLIC_VERSION: ${{ steps.rendezvous.outputs.public_version }}
        run: |
          set -euo pipefail

          mapfile -t packages < <(find macos-artifact -type f -name '*.pkg' -print)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one macOS PKG, found ${#packages[@]}" >&2
            exit 1
          fi

          asset="mozkey-space_${PUBLIC_VERSION}_macos_universal.pkg"
          checksum="${asset}.sha256"

          install -m 0644 "${packages[0]}" "$asset"
          sha256sum "$asset" > "$checksum"

          gh release edit \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "mozkey-space ${PUBLIC_VERSION}"

          gh release upload \
            "$RELEASE_TAG" \
            "$asset" \
            "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
