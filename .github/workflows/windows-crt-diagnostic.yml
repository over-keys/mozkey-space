name: Isolated Windows CRT layout diagnostic
on:
  push:
    branches: ['integration/upstream-1.1.0']
    paths:
      - '.github/workflows/windows-crt-diagnostic.yml'
      - 'tools/diagnostics/windows_crt_layout.py'
      - 'tools/release/tests/test_crt_diagnostic.py'
permissions:
  contents: read
concurrency:
  group: isolated-crt-layout-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[toolchain-diagnostic]') }}
  cancel-in-progress: true
jobs:
  inspect:
    if: github.repository == 'over-keys/mozkey-space' && github.ref == 'refs/heads/integration/upstream-1.1.0' && github.event_name == 'push' && contains(github.event.head_commit.message, '[toolchain-diagnostic]')
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Test diagnostic contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tools/release/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic contract test failed' }
      - name: Inspect signed CRT and run isolated app-local probes
        timeout-minutes: 10
        shell: pwsh
        run: |
          python tools/diagnostics/windows_crt_layout.py --output '${{ runner.temp }}/crt-layout'
          if ($LASTEXITCODE -ne 0) { throw 'CRT diagnostic failed; inspect evidence' }
      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crt-layout-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/crt-layout/*.json
            ${{ runner.temp }}/crt-layout/*.log
          if-no-files-found: warn
          retention-days: 7
